name: Probe site
on:
  push:
    branches: [probe/gridfinity]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests && python scripts/probe_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm i --no-save playwright@1.48.2 > /dev/null
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node scripts/probe_net.js
