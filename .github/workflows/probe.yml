name: Probe site
on:
  push:
    branches: [probe/gridfinity]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DrFlGd/Generator-Library
          ref: website-downloads
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cat > /tmp/live.mjs <<'JS'
          import { createWeb } from '/home/runner/work/WebMirror/WebMirror/src/lib/web.js';
          import { readFile } from 'node:fs/promises';
          const catalog = JSON.parse(await readFile('catalog/catalog.json', 'utf8'));
          const entry = catalog.sources.find((s) => s.url === 'https://miniskyline.com/').fallback;
          const web = createWeb();
          for (const d of entry.distributions.filter((d) => d.from)) {
            const t = Date.now();
            const found = await web.findPageAsset(d.from.url, d.from.asset, { folder: d.from.folder });
            const head = await fetch(found.url, { method: 'HEAD' });
            console.log(d.platform, found.name, found.url, head.status, head.headers.get('content-length'), `${Date.now() - t}ms`);
          }
          const icon = await fetch(entry.icon, { method: 'HEAD' });
          console.log('ICON', entry.icon, icon.status, icon.headers.get('content-type'));
          JS
          node /tmp/live.mjs
