name: Probe site
on:
  push:
    branches: [probe/gridfinity]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ["https://gridfinitygenerator.com/en/box"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dynamic]" && python -m playwright install --with-deps chromium
      - run: python scripts/probe_site.py https://miniskyline.com/desktop
