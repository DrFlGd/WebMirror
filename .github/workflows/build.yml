name: Build desktop executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "webmirror/**"
      - "launcher.py"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "webmirror/**"
      - "launcher.py"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: WebMirror-Windows
          - os: macos-latest
            label: macOS
            artifact: WebMirror-macOS
          - os: ubuntu-latest
            label: Linux
            artifact: WebMirror-Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies and packager
        run: python -m pip install -e ".[test,dynamic]" "pyinstaller>=6.11,<7"

      - name: Run tests
        run: python -m pytest -q

      - name: Make Windows portable EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all playwright --name WebMirror launcher.py
          if (!(Test-Path "dist/WebMirror.exe")) { throw "WebMirror.exe was not built" }
          Get-Item "dist/WebMirror.exe" | Select-Object Name,Length

      - name: Make macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --collect-all playwright --name WebMirror launcher.py
          test -d dist/WebMirror.app
          ditto -c -k --sequesterRsrc --keepParent dist/WebMirror.app dist/WebMirror-macOS.zip
          test -s dist/WebMirror-macOS.zip

      - name: Make Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all playwright --name WebMirror launcher.py
          test -x dist/WebMirror
          tar -czf dist/WebMirror-Linux.tar.gz -C dist WebMirror
          test -s dist/WebMirror-Linux.tar.gz

      - name: Upload Windows download
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WebMirror-Windows
          path: dist/WebMirror.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload macOS download
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: WebMirror-macOS
          path: dist/WebMirror-macOS.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Linux download
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: WebMirror-Linux
          path: dist/WebMirror-Linux.tar.gz
          if-no-files-found: error
          retention-days: 90

  # Artifacts expire after 90 days and need a GitHub login to download; a release does
  # neither, so Generator Library (and the README link) can point at a permanent download.
  # One release per push to main, tagged build-<run number>, with all three executables.
  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WebMirror build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            downloads/WebMirror.exe
            downloads/WebMirror-macOS.zip
            downloads/WebMirror-Linux.tar.gz
          fail_on_unmatched_files: true
          body: |
            Unsigned desktop executables built from ${{ github.sha }}.
            Windows: run WebMirror.exe. macOS: unzip and open WebMirror.app (use Finder's Open if Gatekeeper blocks it). Linux: extract the tar.gz and run ./WebMirror.
